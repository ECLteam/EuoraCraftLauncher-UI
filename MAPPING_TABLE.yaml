# MAPPING_TABLE — 前端主题系统重构（双内置主题 + 独立外观设置）
# 源: EuoraCraftLauncher-UI 仓库 tryfrontend2 分支（Folia 玻璃化设计参考）
# 目标: 移除自定义主题系统，保留 classic/folia 双内置主题 + appearance 独立设置

# 阶段 A（本文件前半部分）为 Folia 皮肤迁移的映射记录；阶段 B（本段起）为重构记录。
# 阶段 B 方向（用户已确认）：内置主题仅 classic/folia；移除主题设计器/预设库/自定义
#   scheme/自定义 CSS/语义色/密度/减少动效；保留卡片/控件/对话框圆角、卡片透明度(新增)、
#   字体、主色、背景、定时切换；后端精简为 theme_id + appearance；folia 双皮肤放开约束。

removal-map:
  backend:
    - 'ECL/services/themes.py: 删除会话/preset/import-export/sanitize 等，仅保留内置主题 id 与缺省'
    - 'ECL/api/themes.py: 删除 ThemeHandlers（20 个 theme_* 方法）'
    - 'ECL/api/models.py: 删除 Theme*Request 模型与 request_schemas/__all__ 条目'
    - 'ECL/api/registry.py: 从 COMMAND_NAMES 删除全部 theme_*'
    - 'ECL/api/bridge.py: 删除 ThemeService 实例化与 theme-studio 窗口类型/白名单'
    - 'ECL/adapters/tauri.py: 删除 theme:design_* 事件（保留 theme:activated 或一并清理）'
    - 'ECL/plugins/permissions.py + plugin.py: 删除 PermissionScope.THEME 与 themePresets/Effects/Tokens 贡献'
    - 'ECL/utils/config.py: ui.theme 默认值改为 theme_id + mode + primary_color + appearance(radius/card_opacity/font) + schedule'
  frontend:
    - 'types/api.ts: ThemeConfig 去 scheme、appearance 去 semantic/custom_css/density，增 theme_id/card_opacity；删 ThemePresetV1 等'
    - 'config/theme.ts: 去 custom，增 BUILTIN_THEMES/CARD_OPACITY 常量'
    - 'features/themes/: 整个目录删除（api/store/Canvas/Studio/PresetLibrary/runtime/测试）'
    - 'composables/useTheme.ts: 增 themeId/setThemeId（写 data-ui-skin），去 scheme/custom，appearance 精简，card_opacity 写 --card-opacity'
    - 'composables/useUiSkin.ts: UiSkin 类型本地化（去 themeRuntime 依赖）'
    - 'App.vue: 删除 ThemeDesignerCanvas 与 themeDesigner.initialize()'
    - 'views/settings/AppearanceTab.vue/.css: 增主题选择器+卡片透明度滑块，移除 designer/library/scheme/semantic/custom css/density'
  keep:
    - '外观保留：卡片/控件/对话框圆角、字体、卡片透明度(新)、主色、背景、定时切换'
    - 'isFolia 条件标记（TitleBar/Game 等）保留'
    - 'data-ui-skin 双皮肤架构保留'

## 阶段 A 遗留映射（folia 皮肤迁移，已实施）
# 以下为阶段 A 的记录，保留供追溯。

## 令牌映射（token）
# 新增 --control-* token 族（classic 默认值 = 原值，folia 值 = 玻璃化）
tokens:
  control-bg:
    source: 'tryfrontend2 base.css: rgba(255,255,255,0.5) / dark rgba(34,38,48,0.5)'
    classic: 'var(--bg-elevated) / dark var(--bg-elevated)'
    folia: 'rgba(255,255,255,0.5)'
    folia-dark: 'rgba(34,38,48,0.5)'
    note: '控件半透明玻璃底；select 触发器、input、按钮、实例工具栏共用'
  control-bg-hover:
    source: 'tryfrontend2 base.css: rgba(var(--primary-rgb),0.08) / dark 0.12'
    classic: 'var(--bg-hover)'
    folia: 'rgba(var(--primary-rgb, 91,111,245),0.08)'
    folia-dark: 'rgba(var(--primary-rgb, 130,145,255),0.12)'
  control-bg-active:
    source: 'tryfrontend2 base.css: rgba(var(--primary-rgb),0.14) / dark 0.2'
    classic: 'var(--bg-active)'
    folia: 'rgba(var(--primary-rgb, 91,111,245),0.14)'
    folia-dark: 'rgba(var(--primary-rgb, 130,145,255),0.2)'
  control-border:
    source: 'tryfrontend2 base.css: rgba(var(--primary-rgb),0.22) / dark 0.3'
    classic: 'var(--border)'
    folia: 'rgba(var(--primary-rgb, 91,111,245),0.22)'
    folia-dark: 'rgba(var(--primary-rgb, 130,145,255),0.3)'
  control-border-hover:
    source: 'tryfrontend2 base.css: rgba(var(--primary-rgb),0.45) / dark 0.55'
    classic: 'var(--border-hover)'
    folia: 'rgba(var(--primary-rgb, 91,111,245),0.45)'
    folia-dark: 'rgba(var(--primary-rgb, 130,145,255),0.55)'
  control-border-focus:
    source: 'tryfrontend2 base.css: rgba(var(--primary-rgb),0.6) / dark 0.7'
    classic: 'var(--border-focus)'
    folia: 'rgba(var(--primary-rgb, 91,111,245),0.6)'
    folia-dark: 'rgba(var(--primary-rgb, 130,145,255),0.7)'
  control-ring:
    source: 'tryfrontend2 base.css: 0 0 0 2px rgba(var(--primary-rgb),0.18) / dark 0.24'
    classic: 'none' # 严格回退：classic 原无焦点环
    folia: '0 0 0 2px rgba(var(--primary-rgb, 91,111,245),0.18)'
    folia-dark: '0 0 0 2px rgba(var(--primary-rgb, 130,145,255),0.24)'
  control-glow:
    source: 'tryfrontend2 base.css: 0 4px 14px rgba(var(--primary-rgb),0.16) / dark 0.22'
    classic: 'none' # 严格回退：classic 原无 hover 辉光
    folia: '0 4px 14px rgba(var(--primary-rgb, 91,111,245),0.16)'
    folia-dark: '0 4px 16px rgba(var(--primary-rgb, 130,145,255),0.22)'
    note: 'Select 触发器 hover/open 原用 --shadow-hover/--glow-focus，已在组件内恢复并加 folia 作用域覆盖'
  slider-track:
    source: 'tryfrontend2 base.css: rgba(var(--primary-rgb),0.18) / dark 0.28'
    classic: '#e0e0e0 / dark #4a4d55' # 严格回退：classic light 原硬编码 #e0e0e0
    folia: 'rgba(var(--primary-rgb, 91,111,245),0.18)'
    folia-dark: 'rgba(var(--primary-rgb, 130,145,255),0.28)'
  glass-blur:
    source: 'tryfrontend2 base.css: 18px'
    classic: '0px'
    folia: '18px'
    note: '当前 folia.css 已有 --folia-glass-blur: var(--glass-blur, 18px)，统一为 --glass-blur'
  glass-highlight:
    source: 'tryfrontend2 base.css: inset 0 1px 0 rgba(255,255,255,0.55) / dark 0.08'
    classic: 'inset 0 1px 0 rgba(255,255,255,0.55)'
    folia: 'inset 0 1px 0 rgba(255,255,255,0.55)'
    folia-dark: 'inset 0 1px 0 rgba(255,255,255,0.08)'
  aurora-opacity:
    source: 'tryfrontend2 base.css: 1'
    classic: '1'
    folia: '1'
    note: "[data-aurora='0'] 时置 0；main-line 已在 App.vue 添加 .aurora-bg 元素"
  glass-backdrop:
    source: 'tryfrontend2: backdrop-filter: blur(var(--glass-blur)) saturate(1.35)（叠加层/弹窗）'
    classic: 'none'
    folia: 'blur(var(--glass-blur, 18px)) saturate(1.35)'
    note: 'classic 下为 none 保证零视觉影响；folia 下玻璃模糊。saturate(1.35) 随 --glass-blur 一并控制'
  glass-highlight-classic:
    source: 'tryfrontend2 base.css: inset 0 1px 0 rgba(255,255,255,0.55)'
    classic: 'inset 0 1px 0 rgba(255,255,255,0)' # 透明：classic 消费该变量时零视觉影响
    folia: 'inset 0 1px 0 rgba(255,255,255,0.55)'
    folia-dark: 'inset 0 1px 0 rgba(255,255,255,0.08)'
    note: 'Batch 1 曾设 classic 为白色高光，Batch 3 修正为透明，保证 classic 不被新增消费改变'

## 组件 CSS 映射（component → 变更）
components:
  Button.css:
    - '.btn-secondary bg: var(--bg-elevated)→var(--control-bg); border: var(--border)→var(--control-border)'
    - '.btn-secondary:hover bg: var(--bg-hover)→var(--control-bg-hover); border→var(--control-border-hover); +box-shadow:var(--control-glow)'
    - '.btn-secondary:active bg: var(--bg-active)→var(--control-bg-active)'
    - '.btn-text:hover/:active bg→var(--control-bg-hover)/var(--control-bg-active)'
    - '.btn-ghost:hover bg→var(--control-bg-hover); border→var(--control-border-hover); +box-shadow:var(--control-glow)'
    - '.btn-ghost:active bg→var(--control-bg-active)'
    - '.btn-primary:hover +box-shadow:var(--control-glow)'
    - '.btn-danger:hover +box-shadow:0 4px 14px rgba(229,92,92,0.2)'
  Card.css:
    - '.ui-card.hoverable:hover border→var(--control-border-hover); box-shadow→var(--control-glow)'
    - '.card-footer bg: var(--bg-hover)→var(--control-bg-hover)'
  Input.css:
    - '.ui-input border: var(--border)→var(--control-border); bg: var(--bg-elevated)→var(--control-bg)'
    - 'hover border→var(--control-border-hover); focus border→var(--control-border-focus)+box-shadow:var(--control-ring)'
  Select.css:
    - '.select-trigger bg→var(--control-bg); border→var(--control-border); hover border→var(--control-border-hover)+shadow→var(--control-glow)'
    - '.ui-select.open .select-trigger border→var(--control-border-focus)+shadow→var(--control-ring)'
    - '.select-dropdown bg→var(--card-bg); border→var(--control-border); shadow→var(--shadow-md)+inset glass-highlight; +backdrop blur'
  Slider.css:
    - 'track bg→var(--slider-track); thumb +box-shadow 0 0 0 4px rgba(primary,0.12)'
  Tag.css:
    - '.ui-tag--default bg→color-mix(in srgb, var(--text-secondary) 12%, transparent)'
  Progress.css:
    - '.ui-progress__track bg→rgba(var(--primary-rgb),0.16)'
  common.css:
    - '.toolbar + inset box-shadow: var(--glass-highlight)'
  design-system.css:
    - '.ecl-card/.ecl-toolbar/.ecl-badge + inset box-shadow: var(--glass-highlight)'
  Modal.css:
    - '.modal-container shadow→var(--ecl-shadow-pop)+inset glass-highlight; +backdrop blur(var(--glass-blur)) saturate(1.35)'
  FullscreenModal.css:
    - '.fullscreen-modal-wrapper +backdrop blur(var(--glass-blur)) saturate(1.35)'
  InstalledInstanceList.css:
    - '工具按钮/view-switch/toolbar-select/search-box bg→var(--control-bg); border→var(--control-border)'
    - 'active/hover 态 bg→var(--control-bg-hover)/var(--control-bg-active); border→var(--control-border-hover)'
    - '滚动容器 +contain: layout'
  InstancePathSidebar.css:
    - '.btn-add bg→var(--control-bg); border→var(--control-border); hover→var(--control-bg-hover)+var(--control-border-hover)'
    - '滚动容器 +contain: layout'
  InstancesTab.css:
    - '.btn-refresh/.version-count-badge/工具按钮 bg→var(--control-bg); border→var(--control-border); hover→var(--control-bg-hover)'
    - '滚动容器 +contain: layout'
  Game.css:
    - '.running-instances-trigger.inactive bg→var(--control-bg); border→var(--control-border); +backdrop blur'
    - 'hover bg→var(--control-bg-hover); border→var(--control-border-hover)'
    - 'account-type-switch: NRadioButton→NTabs segment（主线已适配，无需再改）'
  Connect.css:
    - '滚动容器 +contain: layout'
  Plugins.css:
    - '滚动容器 +contain: layout'
  SectionLayout.css:
    - '滚动容器 +contain: layout'
  TitleBarTray.vue:
    - '.titlebar-tray-menu bg→var(--card-bg); border→var(--control-border); +inset glass-highlight +backdrop blur'
    - '.tray-menu-item hover/active bg→var(--control-bg-hover)/var(--control-bg-active)'

